name: Собственный клиент — Android APK

on:
  push:
    branches:
      - main
      - feature/sobstvenny-client-foundation
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sobstvenny-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ARM64 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NATIVE_TARGET: arm64-v8a
      CHAQUOPY_BUILD_PYTHON: /opt/hostedtoolcache/Python/3.11.*/x64/bin/python
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Export Python path
        shell: bash
        run: echo "CHAQUOPY_BUILD_PYTHON=$(which python3.11)" >> "$GITHUB_ENV"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platforms;android-37.0
            build-tools;36.0.0
            ndk;27.2.12479018
            cmake;3.31.6

      - name: Configure local.properties
        shell: bash
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          printf 'CHAQUOPY_BUILD_PYTHON=%s\n' "$(which python3.11)" >> local.properties

      - name: Build debug APK
        run: ./gradlew --no-daemon :TMessagesProj:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Sobstvenny-Client-ARM64-debug
          path: TMessagesProj/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
